# Pagedog by hand, on one machine: the Spooler server in memory on
# localhost, Alertmanager as the source, workers as child processes reading
# this same file, the reports in a directory. pagedog.yaml at the
# repository root documents every setting.
#
#   docker run --rm -p 127.0.0.1:8080:8080 \
#     -v ./demo/queues.d:/etc/spooler/queues.d:ro spoolersh/memspoolerd
#   export SPOOLER_API_KEY=local ALERTMANAGER_TOKEN=secret ANTHROPIC_API_KEY=...
#   pagedog server --config demo/local.yaml
#   curl -H "Authorization: Bearer secret" http://127.0.0.1:7070/webhook/alertmanager \
#     --json '{"version":"4","status":"firing","alerts":[{"status":"firing","fingerprint":"deadbeef","startsAt":"2026-11-16T12:00:00Z","labels":{"alertname":"Test","severity":"warning"},"annotations":{"summary":"a test page"}}]}'

spooler:
  host: 127.0.0.1:8080
  api_key: {env: SPOOLER_API_KEY}
  no_tls: true
  spool: default
  # The two queues demo/queues.d declares to memspoolerd.
  incidents: incidents
  reports: reports

webhook:
  listen: 127.0.0.1:7070
  sources:
    - alertmanager:
        token: {env: ALERTMANAGER_TOKEN}

workers:
  max: 3
  runtime:
    exec:
      # This binary, from PATH, on this file: run from the repository root.
      path: pagedog
      args: [worker, --config, demo/local.yaml]
      # All a worker's environment: what the secrets below are read from.
      env:
        SPOOLER_API_KEY: {env: SPOOLER_API_KEY}
        ANTHROPIC_API_KEY: {env: ANTHROPIC_API_KEY}

worker:
  model:
    claude:
      api_key: {env: ANTHROPIC_API_KEY}
  tools:
    prometheus:
      url: http://127.0.0.1:9090
    loki:
      url: http://127.0.0.1:3100
  report:
    fs:
      dir: reports

notify:
  - log: {}
