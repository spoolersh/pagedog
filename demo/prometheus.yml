global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Quiet, as the rest of the stack.
runtime:
  log_level: warn

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: demoapp
    static_configs:
      - targets: [demoapp:8081]
