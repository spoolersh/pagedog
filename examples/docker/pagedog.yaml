# Pagedog inside the compose stack: workers as containers on the stack's
# network, each given a copy of this file, reports on the shared volume,
# the demo app told about them.

spooler:
  host: memspoolerd:8080
  api_key: {env: SPOOLER_API_KEY}
  no_tls: true
  spool: default
  # Declared to memspoolerd in compose.yaml, from queues.d.
  incidents: incidents
  reports: reports

webhook:
  listen: :7070
  sources:
    - alertmanager:
        token: {env: ALERTMANAGER_TOKEN}

workers:
  min: 0
  max: 3
  runtime:
    docker:
      image: spoolersh/pagedog
      # The image's own command runs a worker on this file, put into every
      # worker as the server sees it: compose mounts it for the server alone.
      files:
        /etc/pagedog/pagedog.yaml: /etc/pagedog/pagedog.yaml
      network: pagedog_default
      binds:
        - pagedog_reports:/reports
      # All a worker's environment: what the secrets below are read from.
      env:
        SPOOLER_API_KEY: {env: SPOOLER_API_KEY}
        ANTHROPIC_API_KEY: {env: ANTHROPIC_API_KEY}

worker:
  max_turns: 10

  model:
    claude:
      name: claude-opus-5-5
      api_key: {env: ANTHROPIC_API_KEY}

  tools:
    prometheus:
      url: http://prometheus:9090
    loki:
      url: http://loki:3100

  report:
    fs:
      dir: /reports

notify:
  - log: {}
  - webhook:
      url: http://demoapp:8081/report
