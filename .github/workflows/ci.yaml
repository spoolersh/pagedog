name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this on the tagged commit before goreleaser.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Lint
        run: make lint
